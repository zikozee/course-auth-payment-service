server:
  servlet:
    context-path: /payment
  port: 9090


spring:
  application:
    name: auth-payment-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:5432}/${AUTH_DB_NAME:auth_demo}
    username: ${AUTH_DB_USERNAME:postgres}
    password: ${AUTH_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:30000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      connection-test-query: SELECT 1
  jpa:
    database: POSTGRESQL
    show-sql: ${SHOW_SQL:true}
    hibernate:
      ddl-auto: update

security:
  jwt:
    # note 127.0.0.1 is not the same as local host for the issuer validation
    jwks-uri: ${JWKS_URI:http://127.0.0.1:8080/oauth2/jwks}
    issuer: ${JWKS_URI:http://127.0.0.1:8080}

logging:
  level:

    #    org.springframework.web: DEBUG
        org.springframework.security: DEBUG
