name: payment server test pipeline

on:
  push:
    branches: [feature/ci-cd]

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  SERVICE_PREFIX: payment

jobs:
  build-job-section:
    runs-on: ubuntu-latest
    environment: test

    services:
      postgres:
        image: 'postgres:18'
        env:
          POSTGRES_DB: auth_demo
          POSTGRES_PASSWORD: ${{ secrets.DB_PASS }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
      - run: mvn clean -B -U package # this will run test and consequently create tables and run script

      - name: list all file
        run: ls target/*

      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: payment-artifact
          path: |
            target/*.jar
            Dockerfile
          overwrite: 'true'
          retention-days: 1

  build-and-push-image:
    name: Build and push
    runs-on: ubuntu-latest
    environment: test
    needs:
      build-job-section
    steps:

      - name: download artifact
        uses: actions/download-artifact@v8
        with:
          name: payment-artifact

      - name: list all file
        run: ls

      - name: Generate image tag
        id: image_tag
        run: echo "tag_name=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag_name }}
        run: |
          docker build -t \
            "${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${SERVICE_PREFIX}:${IMAGE_TAG}" .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Push image to Google Artifact Registry
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag_name }}
        run: |
          docker push \
           "${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${SERVICE_PREFIX}:${IMAGE_TAG}"

  clean-registry:
    name: Clean container registry
    runs-on: ubuntu-latest
    environment: test
    needs: build-and-push-image
    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v7
        with:
          repository: zikozee/kubernetes-dev-infra-tester
          ref: main
          path: cleanup #checkout path

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Clean container registry
        run: |
          sed "s/SERVICE_ID/${SERVICE_PREFIX}/g" cleanup/clean-registry/clean-policy.json > "${RUNNER_TEMP}/policy.json"
          
          gcloud artifacts repositories set-cleanup-policies "${GAR_REPOSITORY}" \
            --project="${GCP_PROJECT_ID}" \
            --location="${GAR_LOCATION}" \
            --policy="${RUNNER_TEMP}/policy.json" \
            --no-dry-run